server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: zhouyl
    # HikariCP 连接池配置
    hikari:
      connection-timeout: 3000   # 获取连接超时3秒
      validation-timeout: 2000  # 验证连接超时2秒
      leak-detection-threshold: 60000  # 连接泄漏检测
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 1000ms           # 读超时1秒
    connect-timeout: 500ms    # 连接超时500ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

    # Kafka 配置
  kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        retries: 3
        properties:
          enable.idempotence: true
          request.timeout.ms: 5000      # 请求超时（5秒）
          delivery.timeout.ms: 10000    # 发送总超时（10秒）
      consumer:
        group-id: seckill-order-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        enable-auto-commit: false
        auto-offset-reset: earliest
        properties:
          session.timeout.ms: 10000     # 会话超时（10秒）
          heartbeat.interval.ms: 3000   # 心跳间隔（3秒）
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug